[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-remote"
version = "0.1.0"
description = "Local webcam hand-gesture remote control for Windows (MediaPipe Tasks)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mediapipe==1.0.1",
    "pyautogui==0.9.54",
    "pydantic>=2.13,<3",
    "pyyaml>=6.0.3,<7",
    "pystray==0.19.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put this checkout's src/ first on sys.path. The shared venv holds an editable install that
# points at the main checkout; without this, tests run in a worktree would import main's code.
# tests/conftest.py refuses to run if the import still resolves elsewhere.
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "integration: needs downloaded models or real Windows services; skipped when unavailable",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "tools", "macros"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
